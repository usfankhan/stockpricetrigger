name: Stock Price Check

on:
  schedule:
    - cron: "*/59 * * * *"

  workflow_dispatch:

jobs:
  check-stock:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run stock checker
        run: |
          python main.py
